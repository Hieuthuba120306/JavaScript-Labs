<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>  
	
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/theme.css">    
    
    <script type="text/javascript" language="javascript" src="js/travel-data.js"></script>    
</head>
<body>
    

   
<div class="container">  <!-- start main content container -->
   <div class="row">  <!-- start main content row -->
      <div class="col-md-3">  <!-- start left navigation rail column -->   
      
         <div class="panel panel-info">
           <div class="panel-heading">Continents</div>
           <ul class="list-group" id="continentsList"></ul>
         </div>  <!-- end continents panel -->  
         <div class="panel panel-info">
           <div class="panel-heading">Popular Countries</div>
           <ul class="list-group" id="countriesList"></ul>
         </div>  <!-- end countries panel -->       
      </div>  <!-- end left navigation rail --> 
      
      <div class="col-md-9">  <!-- start main content column -->
         <ol class="breadcrumb">
           <li><a href="#">Home</a></li>
           <li><a href="#">Browse</a></li>
           <li class="active">Posts</li>
         </ol>          
      
         <div class="jumbotron" id="postJumbo">
           <h1>Posts</h1>
           <p>Read other travellers' posts ... or create your own.</p>
           <p><a class="btn btn-warning btn-lg">Learn more &raquo;</a></p>
         </div>        
      
         <!-- start post summaries -->
         <div class="postlist">
         
           <div id="postSummaries"></div>
         </div>
        
      <ul class="pagination" id="pagination"></ul>
      
      </div>  <!-- end main content column -->
   </div>  <!-- end main content row -->
</div>   <!-- end main content container -->  
    
<script>
function addLinkList(list, targetId, activeValue) {
    var target = document.getElementById(targetId);
    list.forEach(function (value) {
        var item = document.createElement("li");
        item.className = "list-group-item" + (value === activeValue ? " active" : "");
        if (value !== activeValue) {
            var link = document.createElement("a");
            link.href = "#";
            link.textContent = value;
            item.appendChild(link);
        } else {
            item.textContent = value;
        }
        target.appendChild(item);
    });
}

function renderPosts(items) {
    var target = document.getElementById("postSummaries");
    items.forEach(function (post, index) {
        var row = document.createElement("div");
        row.className = "row";
        var imageColumn = document.createElement("div");
        imageColumn.className = "col-md-2";
        var imageLink = document.createElement("a");
        imageLink.href = "post.php?id=" + post.id;
        var image = document.createElement("img");
        image.src = "images/travel/" + post.thumb;
        image.alt = post.title;
        image.className = "img-thumbnail";
        imageLink.appendChild(image);
        imageColumn.appendChild(imageLink);

        var textColumn = document.createElement("div");
        textColumn.className = "col-md-10";
        var title = document.createElement("h2");
        title.textContent = post.title;
        var details = document.createElement("div");
        details.className = "details";
        details.appendChild(document.createTextNode("Posted by " + post.user));
        var date = document.createElement("span");
        date.className = "pull-right";
        date.textContent = post.postdate;
        details.appendChild(date);
        var excerpt = document.createElement("p");
        excerpt.className = "excerpt";
        excerpt.textContent = post.excerpt;
        var more = document.createElement("a");
        more.href = "post.php?id=" + post.id;
        more.className = "btn btn-primary btn-sm";
        more.textContent = "Read more";
        var moreParagraph = document.createElement("p");
        moreParagraph.appendChild(more);
        textColumn.appendChild(title);
        textColumn.appendChild(details);
        textColumn.appendChild(excerpt);
        textColumn.appendChild(moreParagraph);
        row.appendChild(imageColumn);
        row.appendChild(textColumn);
        target.appendChild(row);
        if (index < items.length - 1) target.appendChild(document.createElement("hr"));
    });
}

function renderPagination(pageCount, currentPage) {
    var target = document.getElementById("pagination");
    function addPage(label, page, active) {
        var item = document.createElement("li");
        if (active) item.className = "active";
        var link = document.createElement("a");
        link.href = "#";
        link.textContent = label;
        item.appendChild(link);
        target.appendChild(item);
    }
    addPage("«", Math.max(1, currentPage - 1), false);
    for (var page = 1; page <= pageCount; page++) addPage(String(page), page, page === currentPage);
    addPage("»", Math.min(pageCount, currentPage + 1), false);
}

addLinkList(continents, "continentsList");
addLinkList(countries, "countriesList", "Canada");
renderPosts(posts);
renderPagination(9, 4);
</script>
</body>
</html>
